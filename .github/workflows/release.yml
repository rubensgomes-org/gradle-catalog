## GitHub Actions "release.yml" workflow file
##
## Author: Rubens Gomes
## Website: https://rubensgomes.com
##
## Purpose: Automates the release of the gradle-catalog artifact whenever
## code is pushed to the `main` branch. Runs `./gradlew release`, which:
##   1. Strips "-SNAPSHOT" from the version in gradle.properties
##   2. Commits + tags the release, pushes the tag to the `release` branch
##   3. Publishes the artifact to GitHub Packages Maven registry
##   4. Bumps the version to the next -SNAPSHOT and pushes back to `main`
##
## Loop-avoidance note: step 4 pushes back to `main`, which would normally
## re-trigger this workflow. It does not, because the release plugin's git
## pushes authenticate with the auto-provisioned `secrets.GITHUB_TOKEN`
## that `actions/checkout` stores in the local git config (see the Checkout
## step), and GitHub deliberately does NOT start new workflow runs from
## pushes made with that token. The commit message plays no part in this.
##
## Corollary: if the Checkout step is ever switched back to a user PAT,
## the bump push WILL re-trigger this workflow and each release will kick
## off another one. Keep the Checkout step's `token:` as GITHUB_TOKEN.
##
## (Runs in the history titled "[Gradle Release Plugin] - new version
## commit: ..." came from a human pushing those commits from a laptop, not
## from CI.)

name: Release

# ---------------------------------------------------------------------------
# Trigger
# ---------------------------------------------------------------------------
# Fires on every push to main. Feature branches and PRs do NOT trigger this
# workflow — releases only happen from mainline history.
on:
  push:
    branches:
      - main

# ---------------------------------------------------------------------------
# Workflow-level environment
# ---------------------------------------------------------------------------
# GITHUB_USER doubles as:
#   - The `git config user.name` used when the release plugin creates its
#     commits/tags (see the "Configure Git" step below).
#   - The username sent to GitHub Packages when publishing (build.gradle.kts
#     reads it via System.getenv("GITHUB_USER")).
env:
  GITHUB_USER: "rubensgomes"
  GITHUB_USER_EMAIL: "rubens.s.gomes@gmail.com"

jobs:
  release:
    runs-on: ubuntu-latest

    # -----------------------------------------------------------------------
    # Permissions for the auto-provisioned GITHUB_TOKEN
    # -----------------------------------------------------------------------
    # `contents: write`  — REQUIRED. The release plugin's commits/tags are
    #                      pushed with the GITHUB_TOKEN credentials that
    #                      `actions/checkout` writes into the git config,
    #                      so that token needs write access to `main` and
    #                      the `release` branch.
    # `packages: write`  — currently unused: the upload to GitHub Packages
    #                      authenticates with RUBENS_PAT_TOKEN, not with
    #                      GITHUB_TOKEN (see the "Run Release" step). Kept
    #                      because it costs nothing and would be needed if
    #                      publishing ever switched to GITHUB_TOKEN — which
    #                      is not possible today, as the packages live in a
    #                      DIFFERENT repo (rubensgomes-org/mvn-pkgs) that this
    #                      workflow's GITHUB_TOKEN has no access to.
    permissions:
      contents: write
      packages: write

    steps:
      # ---------------------------------------------------------------------
      # 1. Check out the repository
      # ---------------------------------------------------------------------
      # `fetch-depth: 0` grabs FULL history — the release plugin refuses to
      # run against a shallow clone because it needs to inspect tags and
      # rewrite/push commits.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history needed for release plugin
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------------------
      # 2. Provision the JDK
      # ---------------------------------------------------------------------
      # JDK 25 (Temurin) — must match the toolchain used locally so the
      # release build/publish behaves identically to `./gradlew release`
      # run from a developer machine.
      #
      # `github-token` is passed to actions/setup-java so its calls to the
      # GitHub-hosted JDK metadata endpoint are authenticated and don't hit
      # the anonymous rate limit on busy runners.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------------------
      # 3. Configure git identity
      # ---------------------------------------------------------------------
      # Required because the release plugin creates commits (the "pre tag
      # commit" and the "new version commit" you see in `git log`). Without
      # a configured identity git would fail with:
      #   "Please tell me who you are."
      - name: Configure Git
        run: |
          git config --global user.name "$GITHUB_USER"
          git config --global user.email "$GITHUB_USER_EMAIL"

      # ---------------------------------------------------------------------
      # 4. Run the release
      # ---------------------------------------------------------------------
      # Why RUBENS_PAT_TOKEN instead of the default secrets.GITHUB_TOKEN?
      # Because this build publishes to a DIFFERENT repository's package
      # registry — rubensgomes-org/mvn-pkgs (see `mavenRepoPackages` in
      # gradle.properties). The auto-provisioned GITHUB_TOKEN is scoped to
      # THIS repo only, so it cannot upload there. A user-owned PAT can.
      #
      # Scope of this variable — narrower than the name suggests:
      #   - It is read ONLY by the Gradle publish task, via
      #     `System.getenv("GITHUB_TOKEN")` in build.gradle.kts, as the
      #     GitHubPackages repository password.
      #   - It is NOT what git pushes with. `actions/checkout` already
      #     stored `secrets.GITHUB_TOKEN` as an auth header in the local
      #     git config, and git uses that, ignoring this env var entirely.
      #
      # Requirements for the PAT: it must be a CLASSIC token (fine-grained
      # tokens cannot authenticate to the Maven package registry) with the
      # `write:packages` scope and access to rubensgomes-org/mvn-pkgs. When it
      # is rotated, the repo secret must be updated too — a stale value
      # surfaces as "Received status code 401" on the PUT, after the build
      # has otherwise succeeded.
      #
      # `--info` gives verbose log output — useful for post-mortem when a
      # release fails. Switch to `--debug` if you need Gradle internals.
      - name: Run Release
        env:
          GITHUB_TOKEN: ${{ secrets.RUBENS_PAT_TOKEN }}
        run: |
          ./gradlew release --info
